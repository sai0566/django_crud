<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e3e6ea);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            color: #222;
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            min-width: 120px;
            transition: 0.3s ease;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }

            .btn {
                font-size: 14px;
                padding: 11px 16px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
            }

            .container {
                margin-top: 40px;
                padding: 20px 15px;
                border-radius: 12px;
            }

            h2 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }

            .btn-group {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Confirm Delete</h2>

        <form method="POST">
            {% csrf_token %}
            <p>Are you sure you want to delete this employee?</p>

            <div class="btn-group">
                <button type="submit" class="btn delete-btn">Yes, Delete</button>
                <a href="{% url 'details' %}" class="btn cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
