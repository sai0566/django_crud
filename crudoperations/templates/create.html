<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .top-btn {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .top-btn a {
            text-decoration: none;
            background: #2196f3;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .top-btn a:hover {
            background: #1976d2;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
            font-size: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        form p {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 15px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4caf50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.25);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #43a047;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

            input,
            select,
            textarea,
            button {
                font-size: 14px;
                padding: 11px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                margin-top: 20px;
                padding: 20px 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .top-btn a {
                font-size: 13px;
                padding: 7px 12px;
            }

            input,
            select,
            textarea {
                padding: 10px;
                font-size: 14px;
            }

            button {
                padding: 11px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="top-btn">
            <a href="{% url 'details' %}">Back</a>
        </div>

        <h1>Employee Form</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>

    </div>

</body>
</html>
